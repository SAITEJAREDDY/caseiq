    <circle cx="452" cy="190" r="8" fill="#2F9E44"/><path d="M448 190 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="468" y="194">KB article: works 70%+ of time</text>
  </g>
  <g transform="rotate(-6 545 238)">
    <rect x="478" y="222" width="134" height="32" rx="4" fill="none" stroke="#1C7ED6" stroke-width="3"/>
    <text x="545" y="244" text-anchor="middle" font-size="14" font-weight="800" fill="#1C7ED6">FACT-CHECKED</text>
