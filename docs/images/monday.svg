  <path d="M700 255 q-5 -8 0 -16 M712 255 q-5 -8 0 -16" fill="none" stroke="#868E96" stroke-width="2"/>

  <text x="595" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2328">1 tab. 0 archaeology.</text>
  <text x="595" y="372" text-anchor="middle" font-size="15" fill="#1F2328">Coffee still warm.</text>
