  <rect x="250" y="262" width="34" height="40" rx="4" fill="#fff" stroke="#1F2328" stroke-width="2"/>
  <path d="M284 272 q14 0 14 10 q0 10 -14 10" fill="none" stroke="#1F2328" stroke-width="2"/>
